name: Terbitkan Angkasawan Cilik

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "angkasawan-cilik-pages-v2"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Ambil kod repositori
        uses: actions/checkout@v4
      - name: Sediakan GitHub Pages
        uses: actions/configure-pages@v5
      - name: Muat naik laman
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Terbitkan laman
        id: deployment
        uses: actions/deploy-pages@v4
