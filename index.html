 {emoji:'🛰️',tag:'Taklimat misi',title:'Misi Imbuhan Bermula!',body:'Selamat datang, angkasawan! Dalam misi ini, kita akan meneroka imbuhan awalan dan imbuhan akhiran. Imbuhan ialah unsur bahasa yang ditambahkan pada kata dasar untuk membentuk perkataan baharu atau mengubah maknanya.',example:'Contoh: baca → membaca · main → mainan',tip:'Lihat kata dasar dahulu. Kemudian kenal pasti imbuhan yang ditambah.'},

 class="notice">Nota ini ialah sokongan pembelajaran. Cuba terangkan satu contoh imbuhan kepada rakan sebelum memulakan misi “Kongsi Maklumat”.</div>`}
function setNote(i){noteIndex=i;state.notesIndex=i;renderNotes();sound('tap')}
function openMission(i){if(!state.profile.name){showPage('profile');toast('Sila daftar nama ejen dahulu.');return}if(i>0&&!state.completed[i-1]){toast('Selesaikan misi sebelumnya dahulu.');return}currentMission=i;qIndex=0;earned=0;lives=3;timeLeft=95;answered=false;questionFeedback=null;gamePosition=0;diceValue=1;rolled=false;showShareCard=false;state.page='play';document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'));document.getElementById('nav').classList.remove('open');renderMission();timerStart();window.scrollTo({top:0,behavior:'smooth'});sound('tap')}
function renderMission(){if(currentMission===4){renderReflection();return}let m=MISSIONS[currentMission],q=m.questions[qIndex],percent=qIndex/m.questions.length*100;let hud=`<div class="hud"><div class="hud-box"><small>Markah</small><strong id="scoreValue">${earned}</strong></div><div class="hud-box"><small>Masa</small><strong id="timerValue">${timeLeft}s</strong></div><div class="hud-box"><small>Nyawa</small><strong id="livesValue">${'❤️'.repeat(Math.max(0,lives))}${'🤍'.repeat(3-Math.max(0,lives))}</strong></div></div>`;
let preGame=currentMission===3?`<div class="board">${Array.from({length:18},(_,i)=>`<div class="tile ${i===gamePosition?'current':''} ${i<gamePosition?'done':''}"><span class="tile-icon">${i===gamePosition?'🚀':i===17?'🏁':i%5===3?'💎':i%6===2?'🪐':'⭐'}</span><span>${i===17?'TAMAT':'Orbit '+(i+1)}</span></div>`).join('')}</div>${!rolled?`<div class="dice-row"><div class="dice" id="diceFace">🎲</div><div><strong>Lancarkan roket ke orbit seterusnya!</strong><div style="color:#d7e0ff;font-size:13px">Lontar dadu untuk bergerak dan buka cabaran kristal bahasa.</div></div><button class="btn btn-primary" onclick="rollDice()">🎲 LANCAR DADU</button></div>`:`<div class="dice-row"><div class="dice" id="diceFace">${['🎲','⚀','⚁','⚂'][diceValue]||'🎲'}</div><div><strong>Roket bergerak ${diceValue} petak!</strong><div style="color:#d7e0ff;font-size:13px">Jawab cabaran untuk mengumpulkan kristal bahasa.</div></div></div>`}`:'';
let questionPart=currentMission===3&&!rolled?'':`<div class="question-card ${questionFeedback?'loading-burst':''}"><span class="question-chip">${m.phase} · Soalan ${qIndex+1} daripada ${m.questions.length}</span><h2>${q.q}</h2><div class="stimulus">${q.stimulus}</div><div class="answers">${q.opts.map((op,j)=>`<button class="answer-btn ${answered&&j===q.ans?'correct':''} ${answered&&questionFeedback&&!questionFeedback.ok&&j===questionFeedback.choice?'wrong':''}" ${answered|| (currentMission===3&&!rolled)?'disabled':''} onclick="answerQuestion(${j})"><span class="answer-letter">${'ABCD'[j]}</span><span>${op}</span></button>`).join('')}</div>${answered&&questionFeedback?`<div class="feedback ${questionFeedback.ok?'ok':'no'}">${questionFeedback.ok?'✅':'💫'} ${questionFeedback.text}</div>`:''}<div class="question-actions"><span class="tiny-note">${answered?'Jawapan direkodkan. Teruskan apabila bersedia.':lives===0?'Nyawa habis. Jawapan seterusnya tidak akan menambah markah.':'Pilih satu jawapan yang paling tepat.'}</span>${answered?`<button class="btn btn-blue" onclick="nextQuestion()">${qIndex===m.questions.length-1?'🏁 TAMAT MISI':'Soalan seterusnya →'}</button>`:''}</div></div>`;
app.innerHTML=`<div class="game-wrap"><div class="game-top"><div class="game-title"><span class="pill yellow">FASA 0${currentMission+1} · MISI ${String(currentMission+1).padStart(2,'0')}</span><h1>${m.emoji} ${m.title}</h1><p>${m.subtitle}</p></div>${hud}</div><div class="game-progress"><div id="timerBar" style="width:${timeLeft/95*100}%"></div></div>${currentMission===3?preGame:''}${questionPart}<div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:17px;position:relative"><button class="btn btn-light" onclick="quitMission()">← Keluar ke pusat misi</button><span style="align-self:center;color:#dce4ff;font-size:12px">${escapeHtml(state.profile.name)} · ${rank()}</span></div></div>`;}
function answerQuestion(choice){if(answered)return;const q=MISSIONS[currentMission].questions[qIndex];answered=true;const ok=choice===q.ans;if(ok){earned+=4;sound('good');questionFeedback={ok:true,choice,text:q.why}}else{lives=Math.max(0,lives-1);sound('bad');questionFeedback={ok:false,choice,text:`Belum tepat. ${q.why}`}}const sv=document.getElementById('scoreValue'),lv=document.getElementById('livesValue');if(sv)sv.textContent=earned;if(lv)lv.textContent='❤️'.repeat(lives)+'🤍'.repeat(3-lives);renderMission();sound(ok?'good':'bad')}
function nextQuestion(){if(!answered)return;const m=MISSIONS[currentMission];qIndex++;answered=false;questionFeedback=null;rolled=false;if(qIndex>=m.questions.length){finishMission();return}renderMission()}
function rollDice(){if(rolled)return;diceValue=1+Math.floor(Math.random()*3);rolled=true;gamePosition=Math.min(17,gamePosition+diceValue);sound('roll');renderMission();const d=document.getElementById('diceFace');if(d)d.textContent=['⚀','⚁','⚂'][diceValue-1]||'🎲';}
function timeoutMission(){if(state.page!=='play')return;stopTimer();if(currentMission===4){finishReflection();toast('⏰ Masa tamat! Refleksi yang telah ditulis direkodkan.');return}finishMission();toast('⏰ Masa tamat! Markah yang berjaya dikumpulkan telah disimpan.')}
function finishMission(){stopTimer();if(currentMission===4){finishReflection();return}let old=state.scores[currentMission]||0;state.scores[currentMission]=Math.max(old,earned);state.completed[currentMission]=true;state.answers[currentMission]=state.answers[currentMission]||[];save();sound('win');app.innerHTML=`<section class="certificate"><div class="confetti">✨ 🌟 ✨ 🚀 ✨ 🌟</div><div class="medal">${earned>=16?'🏆':'⭐'}</div><div class="tiny-kicker">Misi ${String(currentMission+1).padStart(2,'0')} selesai</div><h2>${earned>=16?'Misi Hebat, Ejen!':'Misi Selesai!'}</h2><p>${escapeHtml(state.profile.name)}, anda memperoleh <strong>${earned}/20 markah</strong> untuk fasa ${MISSIONS[currentMission].phase}.</p><p>${earned>=16?'Penguasaan anda semakin mantap!':'Teruskan berlatih. Anda boleh mengulang misi untuk meningkatkan markah.'}</p><div class="quick-stats" style="max-width:620px;margin:20px auto"><div class="stat-card"><div class="stat-icon" style="background:#fff0b3">⭐</div><div><strong>${totalScore()}/100</strong><span>Markah keseluruhan</span></div></div><div class="stat-card"><div class="stat-icon" style="background:#dcfff1">✅</div><div><strong>${state.completed.filter(Boolean).length}/5</strong><span>Misi selesai</span></div></div><div class="stat-card"><div class="stat-icon" style="background:#efe5ff">🪐</div><div><strong>${rank()}</strong><span>Pangkat semasa</span></div></div></div><div class="hero-actions" style="justify-content:center;margin-top:24px"><button class="btn btn-primary" onclick="showPage('dashboard')">🪐 PUSAT MISI</button>${currentMission<3&&!state.completed[currentMission+1]?`<button class="btn btn-blue" onclick="openMission(${currentMission+1})">Misi seterusnya →</button>`:''}<button class="btn btn-outline" onclick="openMission(${currentMission})">↻ Cuba lagi</button></div></section>`}
function quitMission(){stopTimer();showPage('dashboard')}
function renderReflection(){let qs=[{title:'🌟 Perkara baharu yang saya pelajari',prompt:'Hari ini saya belajar bahawa…'},{title:'🚀 Saya faham tentang imbuhan awalan',prompt:'Satu contoh imbuhan awalan ialah…'},{title:'🪐 Saya faham tentang imbuhan akhiran',prompt:'Satu contoh imbuhan akhiran ialah…'},{title:'💭 Cabaran dan langkah seterusnya',prompt:'Bahagian yang paling mencabar ialah… Saya akan berlatih dengan cara…'}];app.innerHTML=`<div class="game-wrap"><div class="game-top"><div class="game-title"><span class="pill yellow">FASA 05 · REFLEKSI</span><h1>💭 Debrief Angkasawan</h1><p>Berhenti seketika, fikirkan perjalanan anda dan catat perkara yang telah dipelajari.</p></div><div class="hud"><div class="hud-box"><small>Markah</small><strong>${state.scores[4]||0}</strong></div><div class="hud-box"><small>Masa</small><strong id="timerValue">${timeLeft}s</strong></div><div class="hud-box"><small>Nyawa</small><strong>❤️❤️❤️</strong></div></div></div><div class="game-progress"><div id="timerBar" style="width:${timeLeft/95*100}%"></div></div><section class="question-card"><span class="question-chip">Fasa 05 · Refleksi kendiri</span><h2>Apakah yang anda bawa pulang daripada galaksi imbuhan?</h2><p>Lengkapkan empat ayat refleksi. Setiap jawapan yang diisi memberi 5 markah refleksi.</p><div class="reflection-list">${qs.map((q,i)=>`<div class="reflection-item"><h3>${q.title}</h3><label class="help" for="reflection${i}">${q.prompt}</label><textarea id="reflection${i}" maxlength="300" placeholder="Tulis jawapan anda di sini…">${escapeHtml(state.reflections[i]||'')}</textarea></div>`).join('')}</div><div class="question-actions"><span class="tiny-note">Tip: Tulis dengan ayat sendiri. Jawapan disimpan pada peranti ini.</span><button class="btn btn-primary" onclick="finishReflection()">✅ HANTAR REFLEKSI</button></div></section><div style="margin-top:18px"><button class="btn btn-light" onclick="quitMission()">← Keluar ke pusat misi</button></div></div>`}
function finishReflection(){stopTimer();for(let i=0;i<4;i++){const el=document.getElementById('reflection'+i);if(el)state.reflections[i]=el.value.trim()}let points=state.reflections.filter(x=>x.length>0).length*5;state.scores[4]=Math.max(state.scores[4]||0,points);state.completed[4]=true;save();sound('win');app.innerHTML=`<section class="certificate"><div class="confetti">✨ 🪐 ✨ 🚀 ✨ 🪐</div><div class="medal">${points===20?'🏆':'💫'}</div><div class="tiny-kicker">Fasa 05 selesai</div><h2>Refleksi Direkodkan!</h2><p>Anda memperoleh <strong>${points}/20 markah</strong> bagi refleksi. Terima kasih kerana memikirkan perkara yang telah dipelajari.</p><p>${points===20?'Semua refleksi telah dilengkapkan. Anda menyelesaikan perjalanan Angkasawan Cilik!':'Anda boleh kembali ke refleksi dan melengkapkan semua ruang untuk mendapat markah penuh.'}</p><div class="hero-actions" style="justify-content:center;margin-top:24px"><button class="btn btn-primary" onclick="showPage('dashboard')">🪐 KEMBALI KE PUSAT MISI</button><button class="btn btn-outline" onclick="showCertificate()">🎓 Lihat sijil</button></div></section>`}
function showCertificate(){if(!state.completed.every(Boolean)){toast('Selesaikan kelima-lima fasa untuk membuka sijil.');return}document.getElementById('modalRoot').innerHTML=`<div class="modal-backdrop" onclick="if(event.target===this)closeModal()"><div class="modal"><button class="modal-x" onclick="closeModal()">✕</button><section class="certificate"><div class="medal">🏆</div><div class="tiny-kicker">Anugerah Pengembaraan Bahasa</div><h2>Sijil Angkasawan Cilik</h2><p>Dianugerahkan kepada</p><h2>${escapeHtml(state.profile.name)}</h2><p>kerana telah melengkapkan lima fasa pembelajaran imbuhan awalan dan akhiran.</p><div class="confetti">⭐ 🚀 ⭐</div><strong>Markah: ${totalScore()}/100</strong><p><span class="pill yellow">Pangkat ${rank()}</span></p></section><div style="display:flex;gap:10px;margin-top:18px;flex-wrap:wrap;justify-content:center"><button class="btn btn-blue" onclick="window.print()">🖨️ Cetak sijil</button><button class="btn btn-outline" onclick="closeModal()">Tutup</button></div></div></div>`}
function downloadRecord(){const rows=[['Nama ejen',state.profile.name],['Kelas',state.profile.className],['Markah keseluruhan',totalScore()+'/100'],['Pangkat',rank()],['Misi 1 - Meneroka',state.scores[0]+'/20'],['Misi 2 - Kongsi Maklumat',state.scores[1]+'/20'],['Misi 3 - Pembinaan Pengetahuan',state.scores[2]+'/20'],['Misi 4 - Penciptaan Artefak',state.scores[3]+'/20'],['Misi 5 - Refleksi',state.scores[4]+'/20'],['Fasa selesai',state.completed.filter(Boolean).length+'/5'],...state.reflections.map((x,i)=>['Refleksi '+(i+1),x])];const csv='\uFEFF'+rows.map(r=>r.map(c=>'"'+String(c??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8;'}));a.download='rekod-angkasawan-cilik.csv';a.click();URL.revokeObjectURL(a.href);toast('Rekod berjaya dimuat turun.');}
function escapeHtml(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function escapeAttr(s){return escapeHtml(s)}function escapeJs(s){return String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/\n/g,' ')}
load();if(state.audio===false){document.getElementById('audioButton').firstElementChild.textContent='🔇';document.getElementById('audioLabel').textContent='Bunyi senyap'}renderHome();
</script>
