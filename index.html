function toggleNav(){document.getElementById('nav').classList.toggle('open')}
function showPage(page){stopTimer();state.page=page;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));document.getElementById('nav').classList.remove('open');if(page==='home')renderHome();if(page==='notes')renderNotes();if(page==='profile')renderProfile();if(page==='dashboard')renderDashboard();window.scrollTo({top:0,behavior:'smooth'});save()}
function startHere(){if(!state.profile.name){showPage('profile');toast('Daftar nama ejen dahulu sebelum memulakan misi.');return}showPage('dashboard')}
function sound(kind='tap'){if(!state.audio)return;try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;const c=new C(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);const freqs={tap:440,good:760,bad:190,win:980,roll:320};o.frequency.value=freqs[kind]||440;o.type=kind==='bad'?'triangle':'sine';g.gain.setValueAtTime(.0001,c.currentTime);g.gain.exponentialRampToValueAtTime(.075,c.currentTime+.015);g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+(kind==='win'?.35:.15));o.start();o.stop(c.currentTime+(kind==='win'?.36:.16));setTimeout(()=>c.close(),500)}catch(e){}}
function toggleAudio(){state.audio=!state.audio;document.getElementById('audioButton').firstElementChild.textContent=state.audio?'🔊':'🔇';document.getElementById('audioLabel').textContent=state.audio?'Bunyi hidup':'Bunyi senyap';save();if(state.audio)sound('tap')}
function speakNote(i){const n=NOTE_SLIDES[i];if(n)speak(n.title+'. '+n.body+' Petunjuk ejen: '+n.tip)}
function speak(text){if(!state.audio||!('speechSynthesis'in window)){toast(state.audio?'Peranti ini tidak menyediakan bacaan suara.':'Hidupkan bunyi untuk mendengar bacaan.');return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(text);u.lang='ms-MY';u.rate=.88;u.pitch=1.04;speechSynthesis.speak(u)}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.remove('hidden');clearTimeout(toast.handle);toast.handle=setTimeout(()=>t.classList.add('hidden'),2600)}
function stopTimer(){if(timerHandle){clearInterval(timerHandle);timerHandle=null}}
function timerStart(){stopTimer();timeLeft=95;timerHandle=setInterval(()=>{timeLeft--;const el=document.getElementById('timerValue');if(el)el.textContent=`${timeLeft}s`;const bar=document.getElementById('timerBar');if(bar)bar.style.width=Math.max(0,timeLeft/95*100)+'%';if(timeLeft<=0){stopTimer();timeoutMission()}},1000)}

function normalizeWord(s){return String(s||'').toLowerCase().trim().replace(/[.!?\s]+/g,'')}

function renderReflection(){let qs=[{title:'🌟 Perkara baharu yang saya pelajari',prompt:'Hari ini saya belajar bahawa…'},{title:'🚀 Saya faham tentang imbuhan awalan',prompt:'Satu contoh imbuhan awalan ialah…'},{title:'🪐 Saya faham tentang imbuhan akhiran',prompt:'Satu contoh imbuhan akhiran ialah…'},{title:'💭 Cabaran dan langkah seterusnya',prompt:'Bahagian yang paling mencabar ialah… Saya akan berlatih dengan cara…'}];app.innerHTML=`<div class="game-wrap"><div class="game-top"><div class="game-title"><span class="pill yellow">FASA 05 · REFLEKSI</span><h1>💭 Debrief Angkasawan</h1><p>Berhenti seketika, fikirkan perjalanan anda dan catat perkara yang telah dipelajari.</p></div><div class="hud"><div class="hud-box"><small>Markah</small><strong>${state.scores[4]||0}</strong></div><div class="hud-box"><small>Masa</small><strong id="timerValue">${timeLeft}s</strong></div><div class="hud-box"><small>Nyawa</small><strong>❤️❤️❤️</strong></div></div></div><div class="game-progress"><div id="timerBar" style="width:${timeLeft/95*100}%"></div><div class="reflection-banner">${phaseArt(4)}</div></div><section class="question-card"><span class="question-chip">Fasa 05 · Refleksi kendiri</span><h2>Apakah yang anda bawa pulang daripada galaksi imbuhan?</h2><p>Lengkapkan empat ayat refleksi. Setiap jawapan yang diisi memberi 5 markah refleksi.</p><div class="reflection-list">${qs.map((q,i)=>`<div class="reflection-item"><h3>${q.title}</h3><label class="help" for="reflection${i}">${q.prompt}</label><textarea id="reflection${i}" maxlength="300" placeholder="Tulis jawapan anda di sini…">${escapeHtml(state.reflections[i]||'')}</textarea></div>`).join('')}</div><div class="question-actions"><span class="tiny-note">Tip: Tulis dengan ayat sendiri. Jawapan disimpan pada peranti ini.</span><button class="btn btn-primary" onclick="finishReflection()">✅ HANTAR REFLEKSI</button></div></section><div style="margin-top:18px"><button class="btn btn-light" onclick="quitMission()">← Keluar ke pusat misi</button></div></div>`}
function finishReflection(){stopTimer();for(let i=0;i<4;i++){const el=document.getElementById('reflection'+i);if(el)state.reflections[i]=el.value.trim()}let points=state.reflections.filter(x=>x.length>0).length*5;state.scores[4]=Math.max(state.scores[4]||0,points);state.completed[4]=true;save();sound('win');app.innerHTML=`<section class="certificate"><div class="confetti">✨ 🪐 ✨ 🚀 ✨ 🪐</div><div class="medal">${points===20?'🏆':'💫'}</div><div class="tiny-kicker">Fasa 05 selesai</div><h2>Refleksi Direkodkan!</h2><p>Anda memperoleh <strong>${points}/20 markah</strong> bagi refleksi. Terima kasih kerana memikirkan perkara yang telah dipelajari.</p><p>${points===20?'Semua refleksi telah dilengkapkan. Anda menyelesaikan perjalanan Angkasawan Cilik!':'Anda boleh kembali ke refleksi dan melengkapkan semua ruang untuk mendapat markah penuh.'}</p><div class="hero-actions" style="justify-content:center;margin-top:24px"><button class="btn btn-primary" onclick="showPage('dashboard')">🪐 KEMBALI KE PUSAT MISI</button><button class="btn btn-outline" onclick="showCertificate()">🎓 Lihat sijil</button></div></section>`}
function showCertificate(){if(!state.completed.every(Boolean)){toast('Selesaikan kelima-lima fasa untuk membuka sijil.');return}document.getElementById('modalRoot').innerHTML=`<div class="modal-backdrop" onclick="if(event.target===this)closeModal()"><div class="modal"><button class="modal-x" onclick="closeModal()">✕</button><section class="certificate"><div class="medal">🏆</div><div class="tiny-kicker">Anugerah Pengembaraan Bahasa</div><h2>Sijil Angkasawan Cilik</h2><p>Dianugerahkan kepada</p><h2>${escapeHtml(state.profile.name)}</h2><p>kerana telah melengkapkan lima fasa pembelajaran imbuhan awalan dan akhiran.</p><div class="confetti">⭐ 🚀 ⭐</div><strong>Markah: ${totalScore()}/100</strong><p><span class="pill yellow">Pangkat ${rank()}</span></p></section><div style="display:flex;gap:10px;margin-top:18px;flex-wrap:wrap;justify-content:center"><button class="btn btn-blue" onclick="window.print()">🖨️ Cetak sijil</button><button class="btn btn-outline" onclick="closeModal()">Tutup</button></div></div></div>`}
function downloadRecord(){const rows=[['Nama ejen',state.profile.name],['Kelas',state.profile.className],['Markah keseluruhan',totalScore()+'/100'],['Pangkat',rank()],['Misi 1 - Meneroka',state.scores[0]+'/20'],['Misi 2 - Kongsi Maklumat',state.scores[1]+'/20'],['Misi 3 - Pembinaan Pengetahuan',state.scores[2]+'/20'],['Misi 4 - Penciptaan Artefak',state.scores[3]+'/20'],['Misi 5 - Refleksi',state.scores[4]+'/20'],['Fasa selesai',state.completed.filter(Boolean).length+'/5'],...state.reflections.map((x,i)=>['Refleksi '+(i+1),x])];const csv='\uFEFF'+rows.map(r=>r.map(c=>'"'+String(c??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8;'}));a.download='rekod-angkasawan-cilik.csv';a.click();URL.revokeObjectURL(a.href);toast('Rekod berjaya dimuat turun.');}
function escapeHtml(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function escapeAttr(s){return escapeHtml(s)}function escapeJs(s){return String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/\n/g,' ')}
load();if(state.audio===false){document.getElementById('audioButton').firstElementChild.textContent='🔇';document.getElementById('audioLabel').textContent='Bunyi senyap'}renderHome();
</script>
</body></html>
